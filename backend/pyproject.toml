[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-educativa-backend"
version = "0.1.0"
description = "Backend explícito para una POC educativa de RAG"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.10,<3",
  "langchain>=1.4,<1.5",
  "langchain-text-splitters>=1.0,<2",
  "langchain-openai>=1.7,<1.8",
  "openai>=3.46,<4",
  "langchain-chroma>=1.1,<1.2",
  "langchain-ollama>=1.1,<1.2",
  "chromadb>=1.5,<1.6",
  "pypdf>=6.21,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "httpx>=0.28,<1",
  "reportlab>=4.4,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
